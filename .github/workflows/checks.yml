name: Document maintenance checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  HUSKY: '0'
  GENERATE_OPENAPI: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: GENERATE_OPENAPI=false npm test -- --runInBand
      - run: npm run test:maintenance
      - run: npm run build
      - run: ./node_modules/.bin/tsc --noEmit --incremental false -p tsconfig.build.json
